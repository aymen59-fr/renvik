<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renvik</title><style>body{margin:0;font-family:Arial;color:#172b4d;background:linear-gradient(120deg,#fff,#eef6ff)}main{max-width:1080px;margin:auto;padding:32px}.brand{font-size:29px;font-weight:bold}.hero{margin-top:55px;padding:60px;border-radius:32px;background:linear-gradient(135deg,#fff,#dcecff)}h1{font-size:clamp(48px,7vw,82px);line-height:.95;margin:18px 0}.lead{font-size:19px;color:#5a7090;max-width:560px}.search{display:grid;grid-template-columns:1.35fr 1.15fr 1fr 1fr 1fr;gap:10px;padding:12px;border-radius:24px;background:#172b4d}.field{position:relative;padding:13px 15px;border-radius:16px;background:#fff}.field small{display:block;color:#627797;font-size:11px;font-weight:bold;letter-spacing:.1em;margin-bottom:7px}.field input{border:0;background:transparent;outline:0;width:100%;font-size:16px;font-weight:bold;color:#172b4d}.list{display:none;position:absolute;z-index:2;left:0;right:0;top:82px;padding:7px;background:#fff;border:1px solid #cbdcf5;border-radius:14px;box-shadow:0 16px 35px #172b4d22}.list.show{display:block}.opt{padding:10px 11px;border-radius:10px;cursor:pointer}.opt:hover{background:#edf5ff}.code{float:right;color:#627797;font-size:12px}.go{border:0;border-radius:16px;background:#ff5a36;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.note{font-size:12px;color:#5f7396;margin-top:18px}@media(max-width:760px){main{padding:20px}.hero{padding:32px 20px}.search{grid-template-columns:1fr 1fr}.go{grid-column:span 2;min-height:58px}}</style></head><body><main><div class="brand">Renvik</div><section class="hero"><small>TROUVER LE BON DÉPART</small><h1>Le vol qui te convient.<br>Vraiment.</h1><p class="lead">Choisis une ville ou un aéroport, puis compare les offres chez notre partenaire.</p><form class="search" id="form"><label class="field"><small>DÉPART</small><input id="from" value="Paris, tous aéroports" autocomplete="off" aria-label="Départ"><div id="fromList" class="list"></div></label><label class="field"><small>ARRIVÉE</small><input id="to" value="Lisbonne" autocomplete="off" aria-label="Arrivée"><div id="toList" class="list"></div></label><label class="field"><small>ALLER</small><input id="out" type="date" value="2026-10-12" aria-label="Date aller"></label><label class="field"><small>RETOUR</small><input id="back" type="date" value="2026-10-20" aria-label="Date retour"></label><button class="go">Rechercher</button></form><p class="note">Certains liens sont affiliés. Renvik peut percevoir une commission sans modifier le prix.</p></section></main><script>const places=[['Paris, tous aéroports','PAR'],['Paris Charles-de-Gaulle','CDG'],['Paris Orly','ORY'],['Bruxelles','BRU'],['Bruxelles Charleroi','CRL'],['Lille Lesquin','LIL'],['Lisbonne','LIS'],['Londres, tous aéroports','LON'],['Londres Heathrow','LHR'],['Londres Gatwick','LGW'],['Amsterdam Schiphol','AMS'],['Barcelone','BCN'],['Madrid','MAD'],['Rome Fiumicino','FCO'],['Milan Malpensa','MXP'],['Berlin','BER'],['Munich','MUC'],['Vienne','VIE'],['Prague','PRG'],['Dublin','DUB'],['Copenhague','CPH'],['Athènes','ATH'],['Nice','NCE'],['Marseille','MRS'],['Bordeaux','BOD'],['Nantes','NTE'],['Lyon','LYS'],['Toulouse','TLS'],['Brest','BES'],['Bratislava','BTS']];let code={from:'PAR',to:'LIS'};function bind(id){let input=document.querySelector('#'+id),box=document.querySelector('#'+id+'List');function render(){let q=input.value.toLowerCase(),x=places.filter(p=>p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q)).slice(0,6);box.innerHTML=x.map(p=>'<div class="opt" data-code="'+p[1]+'">'+p[0]+' <span class="code">'+p[1]+'</span></div>').join('');box.classList.toggle('show',x.length>0)}input.addEventListener('focus',render);input.addEventListener('input',render);box.addEventListener('mousedown',e=>{let o=e.target.closest('.opt');if(!o)return;input.value=o.textContent.trim().replace(o.dataset.code,'').trim();code[id]=o.dataset.code;box.classList.remove('show')});input.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('show'),120))}bind('from');bind('to');const dd=x=>{let a=x.value.split('-');return a[2]+a[1]};document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();let p=code.from+dd(out)+code.to+dd(back)+'1';location.href='https://www.aviasales.com/?marker=776886.Zz4af98685b1ee4451b7e925b-776886&params='+p});</script></body></html>
