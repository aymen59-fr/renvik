ground:linear-gradient(145deg,#ff704f,#ff4f32);color:#fff;font:700 17px 'DM Sans';cursor:pointer}.note{font-size:12px;color:#5f7396;margin:17px 0 0}@media(max-width:760px){main{padding:24px 16px}.tag{display:none}.hero{margin-top:35px;padding:34px 20px}.search{grid-template-columns:1fr 1fr}.go{min-height:58px;grid-column:span 2}}</style></head><body><main><nav class="nav"><div class="brand"><span class="mark"></span>Renvik</div><span class="tag">Comparateur de départs aériens</span></nav><section class="hero"><p class="eyebrow">TROUVER LE BON DÉPART</p><h1>Le vol qui te convient.<br>Vraiment.</h1><p class="lead">Compare le prix réel, la durée et les aéroports autour de toi. Renvik t’aide à choisir un départ qui a du sens.</p><form class="search" id="search"><label class="field"><small>DÉPART · IATA</small><input id="from" value="PAR" maxlength="3" aria-label="Départ"></label><label class="field"><small>ARRIVÉE · IATA</small><input id="to" value="LIS" maxlength="3" aria-label="Arrivée"></label><label class="field"><small>ALLER</small><input id="out" type="date" value="2026-10-12" aria-label="Date aller"></label><label class="field"><small>RETOUR</small><input id="back" type="date" value="2026-10-20" aria-label="Date retour"></label><button class="go" type="submit">Rechercher</button></form><p class="note">Certains liens sont affiliés. Renvik peut percevoir une commission sans modifier le prix.</p></section></main><script>const f=document.querySelector('#search'),d=x=>{const a=x.value.split('-');return a[2]+a[1]};f.addEventListener('submit',e=>{e.preventDefault();const a=document.querySelector('#from').value.trim().toUpperCase(),b=document.querySelector('#to').value.trim().toUpperCase(),o=d(document.querySelector('#out')),r=d(document.querySelector('#back'));if(a.length!==3||b.length!==3)return alert('Utilise les codes IATA à 3 lettres, par exemple PAR et LIS.');location.href='https://www.aviasales.com/?marker=776886.Zz4af98685b1ee4451b7e925b-776886&params='+a+o+b+r+'
